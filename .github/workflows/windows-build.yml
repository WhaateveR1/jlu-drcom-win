name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Race tests
        run: go test -race ./...

      - name: Build script regression tests
        shell: pwsh
        run: .\scripts\test-build.ps1

      - name: Build package
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jlu-drcom-win
          path: dist/jlu-drcom-win.zip

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test-and-build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jlu-drcom-win
          path: dist
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag .\dist\jlu-drcom-win.zip --title $tag --notes-file .\CHANGELOG.md
          } else {
            gh release upload $tag .\dist\jlu-drcom-win.zip --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
